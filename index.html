<!DOCTYPE HTML>
<html>

<head>
  <meta charset="UTF-8" />
  <title>MVCC API</title>
</head>

<body>
  <h1>MVCC API</h1>
  <script type="module">
    import { SyncMVCCStrategy, SyncMVCCTransaction } from './dist/esm/index.mjs'

    window.repo = {}
    class MyMVCC extends SyncMVCCStrategy {
      read(k) {
        return window.repo[k]
      }
      write(k, v) {
        window.repo[k] = v
      }
      delete(k) {
        delete window.repo[k]
      }
      exists(k) {
        return k in window.repo
      }
    }

    window.root = new SyncMVCCTransaction(new MyMVCC())
  </script>
</body>

</html>
